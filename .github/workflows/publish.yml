name: Publish

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install system dependencies
        run: sudo apt update && sudo apt install gettext
      - name: Build package
        run: uv build
      - name: Check package
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing, no API token needed
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package
        run: uv publish

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload the files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        run: |
          # The section `cz bump` wrote for this tag, without its heading
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($2 == tag); next }
            found
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "$GITHUB_REF_NAME")
          if [ -s notes.md ]; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          # Pre-releases such as v1.0.0a1, v1.0.0rc1 or v1.0.0.dev1
          if [[ "$GITHUB_REF_NAME" =~ ([0-9](a|b|rc)[0-9]+|\.dev[0-9]+)$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
