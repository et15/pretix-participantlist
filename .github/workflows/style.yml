name: Code Style

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'pretix_participantlist/locale/**'
      - 'pretix_participantlist/static/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'pretix_participantlist/locale/**'
      - 'pretix_participantlist/static/**'

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Run ruff format --check
        run: uv run --only-group dev ruff format --check .
      - name: Run ruff check
        run: uv run --only-group dev ruff check .
  packaging:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install system dependencies
        run: sudo apt update && sudo apt install gettext
      - name: Run check-manifest
        run: uvx --with build --with setuptools --with pretix-plugin-build check-manifest .
      - name: Build package
        run: uv build
      - name: Check package
        run: uvx twine check dist/*
